<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্বেচ্ছাসেবী মিলন মেলা ২০২৬ · ফটোকার্ড ক্রিয়েটর</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Tiro+Bangla:ital@1&display=swap" rel="stylesheet">
<style>
:root{--blue:#1e3a8a;--red:#dc2626;--line:#e2e8f0;--mut:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-size:1.15rem;color:var(--blue)}.top small{color:var(--mut)}
.layout{display:grid;grid-template-columns:400px 1fr;gap:24px;padding:24px;max-width:1500px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 110px);overflow:auto}
@media(max-width:980px){form{max-height:none}}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fafafa;min-width:0}
legend{font-weight:700;color:var(--blue);padding:0 6px;font-size:.95rem}
.f{display:flex;flex-direction:column;gap:4px}
label,.lb{font-size:.85rem;font-weight:600;color:#334155}
input[type=text],textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;font-size:.92rem;background:#fff}
input:focus,textarea:focus{outline:2px solid #93a8e8;border-color:var(--blue)}
.seg{display:flex;background:#e2e8f0;padding:3px;border-radius:7px;gap:3px}
.seg label{flex:1;text-align:center;cursor:pointer}
.seg input{display:none}
.seg span{display:block;padding:6px 4px;font-size:.8rem;border-radius:5px;color:#475569}
.seg input:checked+span{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{padding:9px 14px;border:0;border-radius:6px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;background:#e2e8f0;color:#334155;flex:1}
.btn.p{background:var(--red);color:#fff}.btn.p:hover{background:#b91c1c}
.link{background:none;border:0;color:var(--red);text-decoration:underline;cursor:pointer;font:inherit;font-size:.8rem}
.fn{font-size:.8rem;color:var(--mut);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=file]{font-size:.8rem;max-width:100%}
.stage{background:#0f172a;border-radius:12px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:sticky;top:12px;align-self:start}
canvas{display:block;max-width:100%;max-height:82vh;width:auto;height:auto;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
#meta{color:#94a3b8;font-size:.85rem}
</style>
</head>
<body>
<header class="top"><b>ফটোকার্ড ক্রিয়েটর <small>Photocard Creator</small></b><small>মিয়ার বাজার রক্ত দান ফাউন্ডেশন · স্বেচ্ছাসেবী মিলন মেলা ২০২৬</small></header>
<main class="layout">
<form id="ed" autocomplete="off" onsubmit="return false">
<fieldset><legend>মাপ</legend><div class="seg">
<label><input type="radio" name="size" value="1080x1080" checked><span>১:১ · 1080×1080</span></label>
<label><input type="radio" name="size" value="1080x1350"><span>৪:৫ · 1080×1350</span></label></div></fieldset>
<div id="fields" style="display:contents"></div>
<fieldset><legend>অংশগ্রহণকারীর ছবি</legend>
<div class="row"><input type="file" id="pf" accept="image/*"><button type="button" class="link" id="pr">সরান</button></div>
<div class="f"><label for="px">আনুভূমিক সরান</label><input type="range" id="px" min="-100" max="100" value="0"></div>
<div class="f"><label for="py">উল্লম্ব সরান</label><input type="range" id="py" min="-100" max="100" value="0"></div>
<div class="f"><label for="pz">জুম</label><input type="range" id="pz" min="0.6" max="2.5" step="0.05" value="1"></div></fieldset>
<fieldset><legend>পটভূমির ছবি (গ্রুপ ফটো)</legend>
<div class="row"><input type="file" id="bf" accept="image/*"><button type="button" class="link" id="br">সরান</button></div>
<div class="f"><label for="dim">গাঢ়তা</label><input type="range" id="dim" min="0.3" max="0.95" step="0.05" value="0.72"></div></fieldset>
<fieldset><legend>এক্সপোর্ট</legend>
<div class="row"><div class="seg" style="flex:1"><label><input type="radio" name="format" value="png" checked><span>PNG</span></label><label><input type="radio" name="format" value="jpg"><span>JPG</span></label></div>
<div class="seg" style="flex:1"><label><input type="radio" name="scale" value="1"><span>1×</span></label><label><input type="radio" name="scale" value="2" checked><span>2× শার্প</span></label></div></div>
<div class="row"><button type="button" class="btn p" id="dl">ডাউনলোড করুন</button></div></fieldset>
</form>
<section class="stage"><canvas id="cv" width="1080" height="1080"></canvas><p id="meta">1080 × 1080 px</p></section>
</main>

function row(c,parts,cx,yc,maxW){const m=f=>parts.map(p=>(c.font=fnt(p.s*f,p.w),c.measureText(p.t).width+(p.g||0)*f));
let ws=m(1),tot=ws.reduce((a,b)=>a+b,0);const f=Math.min(1,maxW/tot);if(f<1){ws=m(f);tot=ws.reduce((a,b)=>a+b,0)}
let x=cx-tot/2;const big=Math.max(...parts.map(p=>p.s))*f;c.textAlign='left';c.textBaseline='alphabetic';
parts.forEach((p,i)=>{c.font=fnt(p.s*f,p.w);c.fillStyle=p.c;c.fillText(p.t,x+(p.g||0)*f,yc+big*.32);x+=ws[i]})}
